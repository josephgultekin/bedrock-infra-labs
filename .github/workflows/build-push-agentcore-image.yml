name: Build and push AgentCore agent image

on:
  push:
    branches: [main]
    paths:
      - "bedrock-agentcore-lab/agent/**"
      - ".github/workflows/build-push-agentcore-image.yml"
  workflow_dispatch:

permissions:
  id-token: write # required for AWS OIDC
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: bedrock-agentcore-lab/agent
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:latest"
          echo "Pushed $ECR_REPOSITORY:$IMAGE_TAG"
